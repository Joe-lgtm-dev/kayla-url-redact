name: Standalone package

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test-distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install "build>=1.2,<2" "pytest>=8,<10" "twine>=6,<7"
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Install the built wheel without runtime dependencies
        run: python -c "import glob, subprocess, sys; subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', *glob.glob('dist/*.whl')], check=True)"
      - name: Verify installed package outside the checkout
        run: python -I tools/verify_install.py
